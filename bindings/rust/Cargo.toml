[package]
name = "dash-em"
version = "1.0.0"
edition = "2021"
authors = ["Gaurav Gosain"]
license = "MIT"
description = "Enterprise-Grade Em-Dash Removal Library — SIMD-Accelerated String Processing"
keywords = ["em-dash", "string", "simd", "performance"]
categories = ["text-processing", "algorithms"]
repository = "https://github.com/Gaurav-Gosain/dash-em"
homepage = "https://github.com/Gaurav-Gosain/dash-em"
readme = "../../README.md"
include = [
    "Cargo.toml",
    "Cargo.lock",
    "build.rs",
    "src/**/*",
    "examples/**/*",
]

[lib]
name = "dashem"
path = "src/lib.rs"

[dependencies]

[build-dependencies]
cc = "1.0"

[[example]]
name = "simple"
path = "examples/simple.rs"
