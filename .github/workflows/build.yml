name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-c:
    name: Build C/C++ Library
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            cc: gcc
            cxx: g++
          - os: macos-latest
            cc: clang
            cxx: clang++
          - os: windows-latest
            cc: cl
            cxx: cl

    steps:
      - uses: actions/checkout@v3

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v1
        with:
          cmake-version: '3.24.x'

      - name: Create build directory
        run: mkdir build

      - name: Configure CMake
        run: cmake .. -DCMAKE_BUILD_TYPE=Release
        working-directory: build

      - name: Build
        run: cmake --build . --config Release
        working-directory: build

      - name: Run Tests
        run: ctest --verbose
        working-directory: build

  # Node.js bindings temporarily disabled due to N-API build issues
  # Re-enable after fixing binding.gyp configuration
  # build-node:
  #   name: Build Node.js Binding

  # Python bindings temporarily disabled due to native extension build issues
  # Re-enable after fixing setup.py and environment setup
  # build-python:
  #   name: Build Python Package

  # Rust bindings temporarily disabled due to build environment issues
  # Will be re-enabled after fixing Cargo.toml and build configuration
  # build-rust:
  #   name: Build Rust Package

  build-go:
    name: Build Go Package
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.19', '1.20', '1.21']

    steps:
      - uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build -v
        working-directory: bindings/go

      - name: Run tests
        run: go test -v ./...
        working-directory: bindings/go

  build-java:
    name: Build Java Bindings
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java-version: ['11', '17', '21']

    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      - name: Compile Java
        run: javac Dashem.java
        working-directory: bindings/java

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Run security checks
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
