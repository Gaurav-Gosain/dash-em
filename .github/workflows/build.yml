name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-c:
    name: Build C/C++ Library
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            cc: gcc
            cxx: g++
          - os: macos-latest
            cc: clang
            cxx: clang++
          - os: windows-latest
            cc: cl
            cxx: cl

    steps:
      - uses: actions/checkout@v4

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v1
        with:
          cmake-version: '3.30.x'

      - name: Create build directory
        run: mkdir build

      - name: Configure CMake
        run: cmake .. -DCMAKE_BUILD_TYPE=Release
        working-directory: build

      - name: Build
        run: cmake --build . --config Release
        working-directory: build

      - name: Run Tests
        run: ctest --verbose -C Release
        working-directory: build
        env:
          DASHEM_FUZZ_SEED: 12345  # Fixed seed for reproducible fuzzing in CI

  build-node:
    name: Build Node.js Binding
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['18.x', '20.x', '24.x']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install
        working-directory: bindings/node

      - name: Build
        run: npm run build
        working-directory: bindings/node

      - name: Run tests
        run: npm test
        working-directory: bindings/node

  build-python:
    name: Build Python Package
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build dependencies
        run: pip install build setuptools wheel

      - name: Build
        run: python -m build
        working-directory: bindings/python

      - name: Install wheel
        shell: bash
        run: pip install dist/*.whl
        working-directory: bindings/python

      - name: Run tests
        run: python test_dashem.py
        working-directory: bindings/python

  build-rust:
    name: Build Rust Package
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release
        working-directory: bindings/rust

      - name: Run tests
        run: cargo test --release
        working-directory: bindings/rust

      - name: Run example
        run: cargo run --release --example simple
        working-directory: bindings/rust

  build-go:
    name: Build Go Package
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ['1.23', '1.24', '1.25']

    steps:
      - uses: actions/checkout@v4

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v1
        with:
          cmake-version: '3.30.x'

      - name: Build C library (required for Go tests)
        run: |
          mkdir -p build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release
        shell: bash

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Build
        run: go build -v
        working-directory: go
        env:
          CGO_LDFLAGS: -L../build

      - name: Run tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Skip tests on Windows - CMake creates .lib files, not .a
            echo "Skipping tests on Windows due to library format differences"
            exit 0
          fi
          go test -v ./...
        working-directory: go
        env:
          CGO_LDFLAGS: -L../build
          LD_LIBRARY_PATH: ../build:$LD_LIBRARY_PATH

  build-java:
    name: Build Java Bindings
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java-version: ['17', '21']

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      - name: Compile Java
        run: javac Dashem.java
        working-directory: bindings/java

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run security checks
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
